# Default configuration. Every value marked (ASSUMED) is not specified in the paper;
# see docs/decisions.md for the reasoning. Change here, never in code.
seed: 42

graph:
  top_k_neighbors: 200          # paper Sec IV-E, footnote 5

node2vec:
  dim: 128                      # (ASSUMED)
  num_walks: 10                 # paper's best: 10
  walk_length: 10               # paper's best: 10
  p: 1.0                        # paper's best
  q: 1.0                        # paper's best
  window: 10                    # (ASSUMED)
  negative: 5                   # (ASSUMED)
  epochs: 1                     # (ASSUMED)
  workers: 4

propagation:
  num_neighbors: 5              # paper Sec IV-A
  aggregation: mean             # (ASSUMED) paper says only "aggregated"
  hops: 1                       # paper limits to one hop

dynamic:
  step_blocks: 100000           # (ASSUMED) paper says "daily"; see decisions.md

model:
  n_estimators: 500             # (ASSUMED)
  class_weight: balanced        # (ASSUMED)
  threshold: 0.5                # (ASSUMED)
  test_size: 0.2                # (ASSUMED)
  n_seeds: 5

synthetic:
  n_blocks: 100000
  n_users: 3000
  n_hubs: 10
  n_miners: 10
  n_merchants: 300
  n_fraud_clusters: 25
  cluster_size: 12
  fraud_window_frac: 0.5
